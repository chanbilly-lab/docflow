name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/package_health.py
      - run: python -m pip install -r backend/requirements-runtime.txt
      - run: python scripts/package_cases.py
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments/dev init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/environments/dev validate
      - run: terraform -chdir=infra/environments/dev test

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/dev.py bootstrap
      - run: python scripts/dev.py check
