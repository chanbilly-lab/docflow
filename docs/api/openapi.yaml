                    }
                  ]
                }
              }
            }
          },
          "409": {
            "description": "CASE_INVALID_STATE or UPLOAD_CONFLICT; no upload URL issued.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "FILE_TOO_LARGE for the declared MIME type.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "415": {
            "description": "MIME_TYPE_NOT_ALLOWED.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "DOCUMENT_TYPE_NOT_ALLOWED by the bound historical template.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Owner requester or admin only; Case must be DRAFT or NEEDS_INFORMATION. Atomically reserve UPLOADING metadata and audit before returning a 600-second S3 SigV4 PUT. No file bytes in this request. Body size maximum 8192 characters (base64 encoded body counts before decoding). The client sends raw File/Blob bytes directly to S3 with requiredHeaders; the browser sets the signed Content-Length from the exact fileSize. Conditional PUT prevents overwrites. A URL is not immediately revoked by a later Case transition. No HTTP retry deduplication; failed signing may leave audited UPLOADING metadata.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UploadRequest"
              }
            }
          }
        },
