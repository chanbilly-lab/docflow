  "paths": {
    "/api/v1/health": {
      "get": {
        "operationId": "getHealth",
        "summary": "Authenticated API liveness",
        "description": "Requires a Cognito access token with aws.cognito.signin.user.admin scope. Does not check database readiness.",
        "security": [
          {
            "cognitoAccessToken": []
          }
        ],
        "parameters": [
          {
            "name": "X-Correlation-Id",
            "in": "header",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,64}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authenticated handler reachable",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status",
                    "service"
                  ],
                  "additionalProperties": false,
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "ok"
                      ]
                    },
                    "service": {
                      "type": "string",
                      "enum": [
                        "docflow"
                      ]
                    }
                  }
                }
              }
            },
            "headers": {
              "X-Correlation-Id": {
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            }
          },
          "401": {
            "description": "Missing/invalid token or invalid trusted claims; gateway uses message, backend uses error envelope."
          },
          "403": {
            "description": "Valid JWT without required scope."
          },
          "429": {
            "description": "Request throttle exceeded."
          },
          "500": {
            "description": "Unexpected failure."
          },
          "502": {
            "description": "Integration failure."
          }
        }
      }
    },
