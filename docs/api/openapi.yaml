            "name": "X-Correlation-Id",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,64}$"
            },
            "description": "Invalid/absent values are replaced with a generated ID."
          }
        ]
      }
    },
