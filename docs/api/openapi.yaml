    "/api/v1/cases/{caseId}/submit": {
      "post": {
        "operationId": "submitCase",
        "summary": "Submit validated Case",
        "description": "Owner requester or admin only. DRAFT required. All required types present and all active documents VALID. Key scoped to Case/principal, cross-operation reuse conflicts; durable replay does not create a new attempt. No receipt expiry. After atomic acceptance, start the deterministic Standard execution; HTTP replay also recovers an unfinished start. workflowExecutionId may be enriched without repeating business effects.",
        "security": [
          {
            "cognitoAccessToken": []
          }
        ],
        "parameters": [
          {
            "name": "caseId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^c_[A-Za-z0-9_-]{1,100}$"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "minLength": 36,
              "maxLength": 36
            }
          },
          {
            "name": "X-Correlation-Id",
            "in": "header",
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "maxProperties": 0
              }
            }
          }
        },
        "responses": {
          "400": {
            "description": "Invalid empty-object body or UUID Idempotency-Key.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Requester/admin role required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Case missing or inaccessible.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "CASE_INVALID_STATE, SUBMISSION_CONFLICT or IDEMPOTENCY_KEY_REUSED.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "REQUIRED_DOCUMENT_MISSING, DOCUMENT_INVALID or DOCUMENT_NOT_READY.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Dependency/start/identity failure or pending intent older than 85 days. Receipt remains committed; retry with the same key. WORKFLOW_RECOVERY_REQUIRED needs operator investigation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "202": {
            "description": "Durable acceptance and attempted Standard start. Replay preserves original status/attempt, enriching execution ID only for that same current attempt. It does not mean review completed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubmissionResponse"
                }
              }
            }
          }
        }
      }
    },
