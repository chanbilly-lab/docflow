      "post": {
        "operationId": "resubmitCase",
        "summary": "Resubmit validated Case",
        "description": "Owner requester or admin only. NEEDS_INFORMATION required. All required types present and all active documents VALID. Key scoped to Case/principal, cross-operation reuse conflicts; durable replay does not create a new attempt. No receipt expiry. After atomic acceptance, start the deterministic Standard execution; HTTP replay also recovers an unfinished start. workflowExecutionId may be enriched without repeating business effects.",
