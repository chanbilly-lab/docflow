        "description": "Owner requester or admin may soft-delete a document only while the Case is DRAFT or NEEDS_INFORMATION. No request body or query parameters. Atomic Case condition, document tombstone and audit. Repeat of an already-deleted document returns 204 without another audit, but still requires current authorization and mutable Case state. Concurrent changes return 409; refresh and retry. Physical S3 bytes remain; issued upload URLs are not revoked. Case detail omits DELETED documents; replacement uses a new documentId through upload-url.",
