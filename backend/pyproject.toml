[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-backend"
version = "0.1.0"
description = "DocFlow backend package skeleton"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3==1.43.94"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2", "pytest>=8,<10", "build>=1,<2", "boto3-stubs[dynamodb]==1.43.94", "moto[dynamodb,events,sqs]==5.2.3", "jsonschema==4.26.0", "types-jsonschema==4.26.0.20260518"]

[tool.setuptools.package-data]
common = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests/unit", "tests/integration"]
